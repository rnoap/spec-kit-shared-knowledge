# knowledge-config.yml
# Schema version: 1.0
#
# This file declares which Git repositories are knowledge sources for this project.
# Commit this file to share knowledge source configuration with your team.
# The cache/ directory and knowledge-index.md are local only — add them to .gitignore.
#
# Usage:
#   /speckit.knowledge.configure <url-or-local-path> [--revision <rev>] [path_filter ...]
#   /speckit.knowledge.sync [--force]
#   /speckit.knowledge.remove <label> [--disable | --enable]
#   /speckit.knowledge.status
#
# A "knowledge source" can be either:
#   1. A remote Git URL (HTTPS or SSH)
#   2. A LOCAL path to a Git repository on your machine — useful when you have
#      the repo cloned and updated locally and want to avoid network roundtrips,
#      or when the repo is on a private network and not yet pushed.
#
# Path filters are optional. With zero filters, every .md file in the repository
# is indexed. With one or more filters, indexing is scoped to ONLY those folders.
#
# ─────────────────────────────────────────────────────────────────────────────
# SECURITY — READ BEFORE ADDING A SOURCE
# ─────────────────────────────────────────────────────────────────────────────
# THIS FILE IS COMMITTED AND SHARED. Adding a `url` here causes that location to
# be fetched on every teammate's machine and every automated environment that
# later runs a sync — including via the automatic hooks, which the person who
# approves your change may never run themselves.
#
# Fetched content is read as DATA and is never executed. But the extension does
# NOT protect you from:
#   1. prompt injection — fetched markdown enters the agent's context unchecked
#   2. credential exposure — your git credential helper decides what to send to
#      whatever host is configured here
#   3. symlink following — a fetched .md may link to a file outside the repo,
#      which the agent is then told to read
#
# Read the "Trust model" section of the README before adding a source you do not
# control, and treat a change to this file as a security review, not a config
# tweak.
#
# See: README.md in the spec-kit-shared-knowledge repository for full documentation.

schema_version: "1.0"   # required; must be exactly "1.0"

# ──────────────────────────────────────────────────────────────────────────────
# Optional — project-wide cache freshness policy
# ──────────────────────────────────────────────────────────────────────────────
# When set, a source whose cache is younger than this age is served from disk and
# no network access happens at all. Overridable per source (see Example 6).
#
# Format: <N><unit> where unit is m (minutes), h (hours) or d (days).
#   30m   4h   7d
#
# Omitted (the default) means NO policy: every sync fetches, exactly as in 1.3.0.
#
# This is a hint, not an expiry. It governs only whether a refresh is ATTEMPTED.
# A cache older than its age is still served when the source cannot be reached —
# configuring a policy never leaves you with less knowledge than you had before.
#
# max_cache_age: 4h

# ──────────────────────────────────────────────────────────────────────────────
# Optional — project-wide context budget
# ──────────────────────────────────────────────────────────────────────────────
# A ceiling on the knowledge corpus the INDEX exposes — that is, on how much the
# agent is instructed to read. Two independent limits; set either, both, or none.
#
#   max_items: <N>              a whole number, 1 or greater
#   max_bytes: <N>kb | <N>mb    binary units — 512kb, 2mb
#
# Omitted (the default) means NO limit, and the index is exactly what it would
# have been before this feature existed. No default value is applied: a project
# that upgrades and changes nothing observes nothing new.
#
# The budget bounds the INDEX ONLY. Nothing is removed from the cache and nothing
# stops being searchable — a withheld item is un-injected, not unavailable.
#
# When the budget binds, sync states exactly what it withheld: counts and sizes
# per source, plus any item too large to fit on its own. `--verbose` lists every
# withheld path. Nothing is ever dropped silently.
#
# max_items: 120
# max_bytes: 1mb

sources:                 # required; may be empty list []

  # ────────────────────────────────────────────────────────────────────────────
  # Example 1 — Remote Git URL, single folder filter
  # ────────────────────────────────────────────────────────────────────────────
  # - url: https://github.com/your-org/your-repo            # required; SSH or HTTPS Git URL
  #   label: my-service                                     # optional; default: <host>/<org>/<repo>
  #   path_filter: specs/                                   # optional single folder
  #   enabled: true                                         # optional; default true

  # ────────────────────────────────────────────────────────────────────────────
  # Example 2 — Remote URL, NO filter (indexes every .md in the repo)
  # ────────────────────────────────────────────────────────────────────────────
  # - url: git@github.com:your-org/architecture-decisions.git
  #   label: adr-repo
  #   # path_filter omitted → all .md files indexed

  # ────────────────────────────────────────────────────────────────────────────
  # Example 3 — LOCAL absolute path
  # ────────────────────────────────────────────────────────────────────────────
  # - url: /Users/devuser/repos/payment-service             # absolute filesystem path
  #   label: payment-service
  #   path_filter: specs/

  # ────────────────────────────────────────────────────────────────────────────
  # Example 4 — LOCAL path with tilde (~ expanded to $HOME)
  # ────────────────────────────────────────────────────────────────────────────
  # - url: ~/repos/identity-service                         # tilde-prefixed path
  #   label: identity-service
  #   path_filter: docs/decisions/

  # ────────────────────────────────────────────────────────────────────────────
  # Example 5 — MULTIPLE folders (YAML list form)
  # ────────────────────────────────────────────────────────────────────────────
  # - url: ~/repos/shared-contracts
  #   label: shared-contracts
  #   path_filter:                                          # list form indexes BOTH trees, nothing else
  #     - specs/
  #     - docs/decisions/

  # ────────────────────────────────────────────────────────────────────────────
  # Example 6 — PINNED REVISION and a per-source freshness override
  # ────────────────────────────────────────────────────────────────────────────
  # - url: https://github.com/your-org/payments
  #   label: payments-v2
  #   revision: v2.4.1                                      # branch, tag, or FULL commit SHA
  #   max_cache_age: 7d                                     # overrides the project-wide value
  #   path_filter: specs/
  #
  # `revision` omitted → the remote's default revision, exactly as before.
  #
  # A pinned source gets its own cache, so the SAME repository may be added twice
  # at two revisions without the two contaminating each other. Because a URL then
  # no longer identifies one source, every source carries a UNIQUE label — that
  # label is what /speckit.knowledge.remove takes.
  #
  # Abbreviated SHAs (a1b2c3d) are NOT supported: they are not fetchable and a
  # prefix that is unique today can become ambiguous as the repository grows.
  #
  # SSH URLs already contain "@", so pass the revision with the --revision flag
  # rather than the <url>@<rev> shorthand.

  # ────────────────────────────────────────────────────────────────────────────
  # Example 7 — PER-SOURCE CONTEXT BUDGET
  # ────────────────────────────────────────────────────────────────────────────
  # - url: https://github.com/your-org/big-docs
  #   label: big-docs
  #   max_items: 40                                         # sub-ceiling for THIS source
  #   max_bytes: 400kb                                      # sub-ceiling for THIS source
  #
  # NOTE THE DIFFERENCE FROM max_cache_age, which shares the same two positions
  # in this file but NOT the same meaning:
  #
  #   max_cache_age   per-source value REPLACES the project value.
  #   max_items       per-source value is a SUB-CEILING. It can only LOWER what
  #   max_bytes       this source contributes — never raise it above the project
  #                   value, and never above its fair share of that value.
  #
  # A per-source ceiling larger than the project ceiling is clamped down to the
  # project ceiling and the clamp is reported. It does NOT invalidate the source.
  #
  # When a project-wide ceiling is set, it is divided into equal shares across the
  # sources that have items; a source needing less than its share releases the
  # remainder to the others. Within a source, items are taken in ascending path
  # order — so you can work out your own index on paper.

