name: validate

# The v1.2.0 release fixed eight defects that all reached `main`. Four of them —
# a config target spec-kit silently refused to scaffold, an unsupported manifest
# key, an install that copied 110 files instead of 9, and a published archive
# carrying this repo's own workspace — were only found by installing the
# extension into a clean project by hand. Nothing forced that to happen.
#
# This workflow forces it, on every pull request.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Read-only. This workflow needs nothing else, and the repo has no secrets.
permissions:
  contents: read

env:
  # Pinned deliberately. Tracking spec-kit's main branch would turn an upstream
  # change into a red build on an unrelated PR — `specify init --ai` became
  # `--integration` mid-development, which would have done exactly that. Bump
  # this line on purpose, and let the smoke test tell you what broke.
  SPEC_KIT_REF: v1.2.3

jobs:
  validate:
    name: Static validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # git archive needs the full history to resolve export-ignore rules.
          fetch-depth: 0

      - name: Validate the extension package
        run: bash .github/scripts/validate-extension.sh

  smoke:
    name: Install smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        # Exact version, not a floating major: setup-uv stopped publishing those
        # after v7 in favour of immutable release tags. `@v10` does not resolve.
        uses: astral-sh/setup-uv@v10.0.1
        with:
          # This repo has no Python dependencies of its own — no uv.lock, no
          # requirements.txt — so the dependency cache would never invalidate.
          enable-cache: false

      - name: Install spec-kit
        run: |
          uv tool install specify-cli \
            --from "git+https://github.com/github/spec-kit.git@${SPEC_KIT_REF}"
          specify --version

      - name: Install the extension into a clean consumer project
        id: install
        run: |
          set -euo pipefail
          mkdir -p /tmp/consumer && cd /tmp/consumer
          specify init . --integration copilot --non-interactive --force > init.log 2>&1
          specify extension add "$GITHUB_WORKSPACE" --dev 2>&1 | tee install.log

      - name: Assert the install produced what the manifest promised
        run: bash "$GITHUB_WORKSPACE/.github/scripts/assert-install.sh" /tmp/consumer "$GITHUB_WORKSPACE"

      - name: Upload install log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: install-log
          path: /tmp/consumer/*.log
          retention-days: 7

  # A separate job, not a matrix: a matrix would rename the required check above.
  smoke-minimum:
    name: Install smoke test (minimum spec-kit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: false

      - name: Read the minimum spec-kit version from extension.yml
        id: floor
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import re, sys, yaml
          spec = str((yaml.safe_load(open("extension.yml")).get("requires") or {}).get("speckit_version", ""))
          bound = re.search(r">=\s*([0-9][0-9A-Za-z.+-]*)", spec)
          if not bound:
              sys.exit(f"requires.speckit_version has no >= bound to test: {spec!r}")
          print(f"version={bound.group(1)}")
          PY

      - name: Install spec-kit at the declared minimum
        env:
          FLOOR: ${{ steps.floor.outputs.version }}
        run: |
          uv tool install specify-cli \
            --from "git+https://github.com/github/spec-kit.git@v${FLOOR}"
          specify --version

      - name: Install the extension into a clean consumer project
        run: |
          set -euo pipefail
          mkdir -p /tmp/consumer && cd /tmp/consumer
          # The floor may predate --non-interactive; closed stdin plus --force lets init finish.
          specify init . --integration copilot --force < /dev/null > init.log 2>&1
          specify extension add "$GITHUB_WORKSPACE" --dev 2>&1 | tee install.log

      - name: Assert the install produced what the manifest promised
        run: bash "$GITHUB_WORKSPACE/.github/scripts/assert-install.sh" /tmp/consumer "$GITHUB_WORKSPACE"

      - name: Upload install log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: install-log-minimum
          path: /tmp/consumer/*.log
          retention-days: 7
